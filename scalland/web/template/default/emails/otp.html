<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; max-width: 400px; margin: 0 auto; padding: 20px;">
    <h2>Your Login OTP</h2>
    <p>Use the following code to log in:</p>
    <div style="background: #f0f0f0; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 4px; font-weight: bold; border-radius: 8px; margin: 20px 0;">
        {{.OTP}}
    </div>
    <p style="color: #666;">This code expires in 2 minutes. Do not share it.</p>
    <p style="color: #999; font-size: 12px;">— {{.AppName}}</p>
</body>
</html>
