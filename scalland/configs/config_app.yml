App:
  server_port: "0"
  jwt_secret: "change-me-in-production"
  timezone: ""
  debug: false

Databases:
  writer:
    driver: ""
    host: "localhost"
    port: "3306"
    user: "root"
    password: ""
    name: "_db"
    timezone: "UTC"
  reader:
    driver: ""
    host: "localhost"
    port: "3306"
    user: "root"
    password: ""
    name: "_db"
    timezone: "UTC"
  migrator:
    driver: ""
    host: "localhost"
    port: "3306"
    user: "root"
    password: ""
    name: "_db"
    timezone: "UTC"

OTP:
  length: 24
  otp_type: "alnum"
  valid_till: 120

SMTPs:
  - name: "default"
    host: "smtp.example.com"
    port: "587"
    username: "user"
    password: "pass"
    from: "no-reply@example.com"

Upgrade:
  enabled: true
  default_channel: "github"
  bin_directory: "./bin"
  preserve_versions: 3

ObjectStorage:
  default:
    enabled: false
    provider: "b2"
    bucket: "your-bucket"
    region: "us-west-004"
    endpoint: "https://s3.us-west-004.backblazeb2.com"
    access_key: ""
    secret_key: ""
